[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-converter"
version = "1.0.0"
description = "Инструмент для конвертации астрономического времени (дробовых дней) в формат UTC."
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Твое Имя", email = "your_email@example.com" }
]

[project.scripts]
astro2utc = "astro_converter.cli:main"